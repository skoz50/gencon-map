<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>True Dungeon Tokens — GenCon Map</title>
  <meta name="description" content="Searchable True Dungeon token list — keepers and trade pile.">

  <!-- Shares the site stylesheet — one level up from /td/. -->
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <nav class="site-nav">
    <a href="/">Schedule</a>
    <a href="/vendors/">Vendor Map</a>
    <a href="/td/" aria-current="page">TD Tokens</a>
  </nav>

  <header>
    <h1>GenCon</h1>
    <p class="tagline">True Dungeon token list — keepers &amp; trade pile</p>
  </header>

  <main>
    <section id="td-panel">
      <h2>Tokens</h2>

      <div id="td-controls" class="td-controls">
        <input type="search" id="td-search" class="td-search"
               placeholder="Search name, flavor, token text…" autocomplete="off"
               aria-label="Search tokens">
        <div class="td-filters">
          <select id="td-slot-filter" class="td-select" aria-label="Filter by slot">
            <option value="">All slots</option>
          </select>
          <button type="button" class="td-legend-btn" id="td-legend-open"
                  aria-label="What do the slots mean? Show the equipping mat"
                  title="Slot reference chart">&#9432;</button>
          <select id="td-class-filter" class="td-select" aria-label="Filter by classification">
            <option value="">All classifications</option>
          </select>
          <!-- "Any Class", not "All Classes": the detail dialog already uses
               "All Classes" to mean a token every class can equip, and reusing
               that string here would read as a filter for exactly those tokens
               rather than as the unfiltered default. -->
          <select id="td-usable-filter" class="td-select" aria-label="Filter by character class">
            <option value="">Any Class</option>
          </select>
          <select id="td-rarity-filter" class="td-select" aria-label="Filter by rarity">
            <option value="">Any Rarity</option>
          </select>
          <select id="td-sort" class="td-select" aria-label="Sort tokens">
            <option value="name">Name (A–Z)</option>
            <option value="rarity-asc">Rarity (Common first)</option>
            <option value="rarity-desc">Rarity (Common last)</option>
          </select>
          <label class="td-checkbox">
            <input type="checkbox" id="td-keepers-only">
            Keepers only
          </label>
        </div>
        <p id="td-count" class="td-count" role="status"></p>
      </div>

      <p class="empty-state" id="td-status">Loading tokens&hellip;</p>
      <div id="td-list" class="td-grid"></div>
    </section>
  </main>

  <dialog id="td-detail" class="td-dialog" aria-labelledby="td-detail-title">
    <div class="td-dialog__inner">
      <div class="td-dialog__head">
        <h3 class="td-dialog__title" id="td-detail-title"></h3>
        <button type="button" class="td-dialog__close" id="td-detail-close" aria-label="Close">&times;</button>
      </div>
      <div id="td-detail-body"></div>
    </div>
  </dialog>

  <dialog id="td-legend" class="td-dialog td-legend-dialog" aria-labelledby="td-legend-title">
    <div class="td-dialog__inner">
      <div class="td-dialog__head">
        <h3 class="td-dialog__title" id="td-legend-title">Character Equipping Mat</h3>
        <button type="button" class="td-dialog__close" id="td-legend-close" aria-label="Close">&times;</button>
      </div>
      <!-- src is assigned on first open, not here: the chart is ~247 KiB and
           most visits never open the legend, so it should not ride along with
           the initial page load on convention wifi. -->
      <!-- Tappable: the dialog caps the chart near 300px wide on a phone, which
           keeps the slot names readable but not the parenthetical sub-labels
           ("Shirt (Vestments or Shirt)" vs "Torso (Armor or Robe)") that make
           the ambiguous slots distinguishable. Opening the file itself gives a
           zoomable full-resolution view. -->
      <a href="images/slot-reference.webp" target="_blank" rel="noopener"
         title="Open the full-size chart">
        <img class="td-legend-image" id="td-legend-image"
             alt="True Dungeon character equipping mat: a diagram showing every token slot — Melee and Ranged Mainhand and Offhand, Head, Eyes, Neck, Ear, Wrists, Hands, Shirt, Torso, Back, Figurine, Finger, Waist, Runestone, Shins, Legs, Feet, Bead, Charm and Ioun Stone — arranged around a character illustration."
             width="900" height="1026" decoding="async">
      </a>
      <p class="td-legend-hint">Tap the chart to open it full size.</p>
      <a class="td-attribution" href="https://truedungeon.com/welcome"
         target="_blank" rel="noopener">Chart courtesy of truedungeon.com/welcome →</a>
    </div>
  </dialog>

  <footer>
    <p>GenCon Map &middot; <a href="https://github.com/skoz50/gencon-map">source</a></p>
    <p>Token data &amp; images courtesy of <a href="https://tokendb.com">tokendb.com</a>.</p>
  </footer>

  <script type="module">
    // Standalone page — no shared script with index.html/vendors beyond the nav.
    const YEAR = 2026;

    // The old `category` field is still in the data but is deliberately unused
    // here: slot/classification are tokendb's canonical vocabulary and are the
    // only axes this page groups or filters on.
    let allTokens = [];

    /**
     * tokendb's own rarity order, transcribed verbatim from the `rare_box`
     * FacetWP facet embedded in https://tokendb.com/'s preload_data — the term
     * sequence their search sidebar renders. It is *not* alphabetized, while
     * their slot / classification / usable_by facets all are, so this sequence
     * is theirs on purpose rather than an artifact of how terms were stored.
     * Copied rather than derived: nothing here is our inference.
     *
     * Read it as tokendb's shelf order, not a strict rarity ladder — the tail
     * (Reserve through Special) is a set of categories, so "Quest" sitting at
     * #24 does not make a Quest token rarer than an Ultra Rare. That is why the
     * sort control says "Common first" instead of "rarest last".
     *
     * Only 7 of these 28 appear in our 142 tokens; the rest are here so a
     * future year's tokens land in the right place without another scrape.
     */
    const RARITY_ORDER = [
      'Common',
      'Uncommon',
      'Rare',
      'Ultra Rare',
      'Transmuted-Enhanced (3 pt)',
      'Transmuted-Exalted (4 pt)',
      'Transmuted-Relic (5 pt)',
      'Transmuted-Arcanum Relic',
      'Transmuted-Eldritch Relic',
      'Transmuted-Legendary',
      'Transmuted-Grand Arcanum',
      'Transmuted-Grand Eldritch',
      'Transmuted-Mythic',
      'Reserve',
      'Trade',
      'Combo-1C',
      'Combo-2C',
      'Combo-3C',
      'Combo-4C',
      'Combo-Trade',
      'Premium',
      'Paragon',
      'Lore',
      'Quest',
      'Safehold',
      'Artisan',
      'Artifact',
      'Special',
    ];

    const RARITY_RANK = new Map(RARITY_ORDER.map((label, i) => [label, i]));

    const listEl = document.getElementById('td-list');
    const countEl = document.getElementById('td-count');
    const searchEl = document.getElementById('td-search');
    const slotEl = document.getElementById('td-slot-filter');
    const classEl = document.getElementById('td-class-filter');
    // Careful: `classEl` above is the *classification* filter (Melee, Armor…).
    // `usableEl` is the character-class filter (Bard, Monk…). Two different
    // axes that both want the word "class"; the names keep them apart.
    const usableEl = document.getElementById('td-usable-filter');
    const rarityEl = document.getElementById('td-rarity-filter');
    const sortEl = document.getElementById('td-sort');
    const keepersEl = document.getElementById('td-keepers-only');
    const dialogEl = document.getElementById('td-detail');
    const dialogTitleEl = document.getElementById('td-detail-title');
    const dialogBodyEl = document.getElementById('td-detail-body');

    // ---- helpers ---------------------------------------------------------

    /** Site convention: a field is shown in full or not at all — never "N/A". */
    function present(value) {
      if (value == null) return false;
      if (Array.isArray(value)) return value.length > 0;
      return String(value).trim() !== '';
    }

    /**
     * tokendb lists a literal "all" alongside every individual class name on
     * the tokens any class can use. Showing both reads as noise, so "all"
     * collapses the whole list.
     */
    function formatUsableBy(usableBy) {
      if (!present(usableBy)) return null;
      if (hasAllClasses(usableBy)) return 'All Classes';
      return usableBy.join(', ');
    }

    /** The literal "all" is a modifier meaning "every class", not a class. */
    function hasAllClasses(usableBy) {
      return (usableBy || []).some(c => String(c).toLowerCase() === 'all');
    }

    function qtyLabel(token) {
      const bits = [];
      if (token.keeper && token.keeperQty) bits.push(`Kept ${token.keeperQty}`);
      if (token.tradeQty > 0) bits.push(`Trade ${token.tradeQty}`);
      return bits.join(' · ');
    }

    // ---- search + filter -------------------------------------------------

    /** Searches name + flavor + text_on_token; missing fields just drop out. */
    function matchesQuery(token, query) {
      if (!query) return true;
      return [token.name, token.flavor, token.text_on_token]
        .filter(present)
        .join(' ')
        .toLowerCase()
        .includes(query);
    }

    /**
     * A token is usable by a class if it names that class, or if it carries the
     * "all" modifier — the same reading behind the dialog's "All Classes" line.
     */
    function matchesUsableBy(token, usableClass) {
      if (!usableClass) return true;
      const usableBy = token.usable_by || [];
      return usableBy.includes(usableClass) || hasAllClasses(usableBy);
    }

    function currentFilters() {
      return {
        query: searchEl.value.trim().toLowerCase(),
        slot: slotEl.value,
        classification: classEl.value,
        usableClass: usableEl.value,
        rarity: rarityEl.value,
        keepersOnly: keepersEl.checked,
      };
    }

    /** All six controls are ANDed together. */
    function applyFilters() {
      const { query, slot, classification, usableClass, rarity, keepersOnly } = currentFilters();

      const filtered = allTokens.filter(t => {
        if (keepersOnly && !t.keeper) return false;
        if (slot && t.slot !== slot) return false;
        if (classification && !(t.classification || []).includes(classification)) return false;
        if (!matchesUsableBy(t, usableClass)) return false;
        if (rarity && t.rarity !== rarity) return false;
        return matchesQuery(t, query);
      });

      renderList(filtered);
    }

    // ---- sort ------------------------------------------------------------

    const byName = (a, b) => a.name.localeCompare(b.name);

    /**
     * Rarity rank per RARITY_ORDER. A value tokendb does not list sorts after
     * every known rarity rather than silently landing at Common — a new rarity
     * string showing up unplaced should be visible, not disguised.
     */
    function rarityRank(token) {
      const rank = RARITY_RANK.get(token.rarity);
      return rank === undefined ? RARITY_ORDER.length : rank;
    }

    /** Name breaks rarity ties, so equal-rarity runs stay alphabetical. */
    function byRarity(a, b) {
      const diff = rarityRank(a) - rarityRank(b);
      if (diff !== 0) return diff;
      // Two unranked values tie above; keep them grouped by their own string.
      const rarityDiff = String(a.rarity || '').localeCompare(String(b.rarity || ''));
      return rarityDiff !== 0 ? rarityDiff : byName(a, b);
    }

    /**
     * Descending flips rarity but NOT the name tiebreak — within one rarity the
     * list stays A–Z, which is what makes a long Common run scannable.
     */
    function currentComparator() {
      switch (sortEl.value) {
        case 'rarity-asc':  return byRarity;
        case 'rarity-desc': return (a, b) => {
          const diff = byRarity(a, b);
          return rarityRank(a) === rarityRank(b) ? diff : -diff;
        };
        default: return byName;
      }
    }

    // ---- render ----------------------------------------------------------

    function renderCard(token) {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'td-card' + (token.keeper ? ' td-card--keeper' : '');

      if (present(token.thumb_path)) {
        const img = document.createElement('img');
        img.className = 'td-thumb';
        img.src = token.thumb_path;
        img.alt = '';               // decorative; the name follows as text
        img.loading = 'lazy';
        img.decoding = 'async';
        img.width = 240;
        img.height = 240;
        card.appendChild(img);
      }

      const name = document.createElement('p');
      name.className = 'td-card-name';
      if (token.keeper) {
        const star = document.createElement('span');
        star.className = 'td-star';
        star.textContent = '★';
        star.title = 'Keeper';
        name.appendChild(star);
      }
      name.appendChild(document.createTextNode(token.name));
      card.appendChild(name);

      const badgeBits = [token.slot, token.rarity].filter(present);
      if (badgeBits.length) {
        const badges = document.createElement('p');
        badges.className = 'td-badges';
        badges.textContent = badgeBits.join(' · ');
        card.appendChild(badges);
      }

      const qty = qtyLabel(token);
      if (qty) {
        const qtyEl = document.createElement('p');
        qtyEl.className = 'td-qty';
        qtyEl.textContent = qty;
        card.appendChild(qtyEl);
      }

      card.addEventListener('click', () => openDetail(token));
      return card;
    }

    function renderList(tokens) {
      listEl.innerHTML = '';

      if (!tokens.length) {
        const empty = document.createElement('p');
        empty.className = 'empty-state';
        empty.textContent = 'No tokens match.';
        listEl.appendChild(empty);
        countEl.textContent = `0 of ${allTokens.length} tokens`;
        return;
      }

      const sorted = [...tokens].sort(currentComparator());
      const frag = document.createDocumentFragment();
      sorted.forEach(t => frag.appendChild(renderCard(t)));
      listEl.appendChild(frag);

      countEl.textContent = tokens.length === allTokens.length
        ? `${tokens.length} tokens`
        : `${tokens.length} of ${allTokens.length} tokens`;
    }

    // ---- detail dialog ---------------------------------------------------

    function addFact(dl, label, value) {
      if (!present(value)) return;      // both-or-nothing: no empty rows
      const row = document.createElement('div');
      const dt = document.createElement('dt');
      dt.textContent = label;
      const dd = document.createElement('dd');
      dd.textContent = Array.isArray(value) ? value.join(', ') : String(value);
      row.append(dt, dd);
      dl.appendChild(row);
    }

    function openDetail(token) {
      dialogTitleEl.textContent = '';
      if (token.keeper) {
        const star = document.createElement('span');
        star.className = 'td-star';
        star.textContent = '★';
        star.title = 'Keeper';
        dialogTitleEl.appendChild(star);
      }
      dialogTitleEl.appendChild(document.createTextNode(token.name));

      dialogBodyEl.innerHTML = '';

      if (present(token.image_path)) {
        const img = document.createElement('img');
        img.className = 'td-dialog__image';
        img.src = token.image_path;
        img.alt = `${token.name} token`;
        img.decoding = 'async';
        dialogBodyEl.appendChild(img);
      }

      if (present(token.flavor)) {
        const flavor = document.createElement('p');
        flavor.className = 'td-dialog__flavor';
        flavor.textContent = token.flavor;
        dialogBodyEl.appendChild(flavor);
      }

      if (present(token.text_on_token)) {
        const tt = document.createElement('p');
        tt.className = 'td-dialog__token-text';
        tt.textContent = token.text_on_token;
        dialogBodyEl.appendChild(tt);
      }

      const facts = document.createElement('dl');
      facts.className = 'td-dialog__facts';
      addFact(facts, 'Slot', token.slot);
      addFact(facts, 'Rarity', token.rarity);
      addFact(facts, 'Classification', token.classification);
      addFact(facts, 'Usable by', formatUsableBy(token.usable_by));
      addFact(facts, 'Source', token.source);
      addFact(facts, 'Year', token.years);
      addFact(facts, 'Kept', token.keeper && token.keeperQty ? token.keeperQty : null);
      addFact(facts, 'Trade pile', token.tradeQty > 0 ? token.tradeQty : null);
      if (facts.children.length) dialogBodyEl.appendChild(facts);

      // Our own curation notes, kept below tokendb's facts so the two sources
      // stay visually distinct.
      if (present(token.notes)) {
        const notes = document.createElement('p');
        notes.className = 'td-notes';
        notes.textContent = token.notes;
        dialogBodyEl.appendChild(notes);
      }
      if (present(token.why)) {
        const why = document.createElement('p');
        why.className = 'td-why';
        why.textContent = `Why: ${token.why}`;
        dialogBodyEl.appendChild(why);
      }

      if (present(token.tokendb_url)) {
        const link = document.createElement('a');
        link.className = 'td-attribution';
        link.href = token.tokendb_url;
        link.target = '_blank';
        link.rel = 'noopener';
        link.textContent = 'View on tokendb.com →';
        dialogBodyEl.appendChild(link);
      }

      dialogEl.showModal();
    }

    document.getElementById('td-detail-close')
      .addEventListener('click', () => dialogEl.close());

    // Click outside the dialog card closes it. The dialog element itself fills
    // only the card area, so a click landing on it is a backdrop click.
    dialogEl.addEventListener('click', event => {
      if (event.target === dialogEl) dialogEl.close();
    });

    // ---- slot-reference legend -------------------------------------------
    // Its own element refs and handlers, deliberately separate from the token
    // detail dialog above — the two share only the .td-dialog styling.
    const legendEl = document.getElementById('td-legend');
    const legendImgEl = document.getElementById('td-legend-image');
    const LEGEND_SRC = 'images/slot-reference.webp';

    document.getElementById('td-legend-open').addEventListener('click', () => {
      if (!legendImgEl.getAttribute('src')) legendImgEl.src = LEGEND_SRC;
      legendEl.showModal();
    });

    document.getElementById('td-legend-close')
      .addEventListener('click', () => legendEl.close());

    legendEl.addEventListener('click', event => {
      if (event.target === legendEl) legendEl.close();
    });

    // ---- filter population -----------------------------------------------

    function populateFilters(tokens) {
      const slots = [...new Set(tokens.map(t => t.slot).filter(present))]
        .sort((a, b) => a.localeCompare(b));
      slots.forEach(slot => {
        const opt = document.createElement('option');
        opt.value = slot;
        opt.textContent = slot;
        slotEl.appendChild(opt);
      });

      const classes = [...new Set(tokens.flatMap(t => t.classification || []).filter(present))]
        .sort((a, b) => a.localeCompare(b));
      classes.forEach(cls => {
        const opt = document.createElement('option');
        opt.value = cls;
        opt.textContent = cls;
        classEl.appendChild(opt);
      });

      // Character classes, derived from the data rather than hardcoded so a
      // future token introducing a new class shows up on its own. "all" is
      // dropped: it is the every-class modifier, not a class of its own.
      const usableClasses = [...new Set(tokens.flatMap(t => t.usable_by || []).filter(present))]
        .filter(c => String(c).toLowerCase() !== 'all')
        .sort((a, b) => a.localeCompare(b));
      usableClasses.forEach(cls => {
        const opt = document.createElement('option');
        opt.value = cls;
        opt.textContent = cls;
        usableEl.appendChild(opt);
      });

      // Rarity, left in discovery order rather than sorted: a dropdown you pick
      // one value from does not need a meaningful sequence, and RARITY_ORDER is
      // where ordering actually matters (the sort control).
      const rarities = [...new Set(tokens.map(t => t.rarity).filter(present))];
      rarities.forEach(rarity => {
        const opt = document.createElement('option');
        opt.value = rarity;
        opt.textContent = rarity;
        rarityEl.appendChild(opt);
      });
    }

    searchEl.addEventListener('input', applyFilters);
    slotEl.addEventListener('change', applyFilters);
    classEl.addEventListener('change', applyFilters);
    usableEl.addEventListener('change', applyFilters);
    rarityEl.addEventListener('change', applyFilters);
    // Sort re-runs the same path: filter, then render. Cheap at 142 tokens.
    sortEl.addEventListener('change', applyFilters);
    keepersEl.addEventListener('change', applyFilters);

    // ---- Fetch on load ---------------------------------------------------
    fetch(`../data/${YEAR}/td-tokens.json`)
      .then(r => r.json())
      .then(data => {
        allTokens = data.tokens || [];
        populateFilters(allTokens);
        document.getElementById('td-status').remove();
        applyFilters();
      })
      .catch(err => {
        console.error('Failed to load TD token data:', err);
        document.getElementById('td-status').textContent = 'Could not load token list.';
      });
  </script>
</body>
</html>
